<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KIOS SEDEKAH DAN RUMAH TAHFIDZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#0f8a4b;
    --primary-dark:#0b6b3a;
    --cream:#f7f6f1;
    --ink:#16241d;
    --muted:#66756c;
    --gold:#b8902e;
    --border:#e4e2da;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',sans-serif;color:var(--ink);background:var(--cream);}
  h1,h2,h3,.brand{font-family:'Plus Jakarta Sans',sans-serif;}
  a{text-decoration:none;color:inherit}
  button{font-family:inherit;cursor:pointer}
  .topbar{background:var(--primary-dark);color:#fff;font-size:13px;padding:6px 24px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
  header.main{background:#fff;border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .brand-block{display:flex;align-items:center;gap:10px;flex:1;min-width:220px}
  .brand-logo{width:38px;height:38px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
  .brand-name{font-weight:700;font-size:17px}
  .brand-tag{font-size:12px;color:var(--muted)}
  .search{flex:2;min-width:200px}
  .search input{width:100%;padding:10px 14px;border-radius:999px;border:1px solid var(--border);background:var(--cream)}
  .nav{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--border);padding:0 24px;overflow-x:auto}
  .nav a{padding:14px 16px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent}
  .nav a.active,.nav a:hover{color:var(--primary-dark);border-color:var(--primary)}
  .container{max-width:1100px;margin:0 auto;padding:28px 24px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;border:1px solid var(--border);background:#fff;font-weight:600;font-size:14px}
  .btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
  .btn-primary:hover{background:var(--primary-dark)}
  .btn-ghost{background:transparent}
  .btn-dark{background:var(--ink);color:#fff}
  .grid{display:grid;gap:16px}
  .grid-products{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px}
  .product-card img,.product-thumb{width:100%;height:110px;border-radius:10px;background:linear-gradient(135deg,#eef6ef,#e3efe6);display:flex;align-items:center;justify-content:center;color:var(--primary);font-size:28px;margin-bottom:10px;object-fit:cover}
  .price{color:var(--primary-dark);font-weight:700;margin-top:4px}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:#e7f5eb;color:var(--primary-dark)}
  .pill-gold{background:#f7efd9;color:var(--gold)}
  .pill-blue{background:#e7eefb;color:#1f4fa3}
  .pill-red{background:#fdecec;color:#b3261e}
  .hero{background:linear-gradient(120deg,var(--primary) 0%,var(--primary-dark) 100%);color:#fff;border-radius:20px;padding:40px 32px;margin-bottom:28px}
  .hero-slider{position:relative;border-radius:20px;overflow:hidden;margin-bottom:28px;background:linear-gradient(120deg,var(--primary) 0%,var(--primary-dark) 100%)}
  .hero-slider-track{display:flex;transition:transform .6s cubic-bezier(.65,0,.35,1)}
  .hero-slide{flex:0 0 100%;min-width:100%;padding:40px 32px;color:#fff;box-sizing:border-box;background-size:cover;background-position:center}
  .hero-slide-overlay{background:linear-gradient(120deg,rgba(15,20,17,.55) 0%,rgba(15,20,17,.25) 100%);margin:-40px -32px;padding:40px 32px;border-radius:20px}
  .hero-dots{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:8px}
  .hero-dot{width:8px;height:8px;border-radius:50%;background:#ffffff66;border:none;cursor:pointer;padding:0;transition:background .2s,width .2s}
  .hero-dot.active{background:#fff;width:22px;border-radius:5px}
  .hero-arrow{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:#ffffff33;border:none;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
  .hero-arrow:hover{background:#ffffff55}
  .hero-arrow.prev{left:14px}
  .hero-arrow.next{right:14px}
  @media (max-width:640px){ .hero-arrow{display:none} }
  .hero h1{font-size:30px;margin:0 0 10px}
  .hero p{opacity:.9;max-width:560px}
  .section-title{font-size:22px;margin:0 0 4px}
  .section-sub{color:var(--muted);margin:0 0 18px;font-size:14px}
  .modal-bg{position:fixed;inset:0;background:rgba(15,20,17,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal{background:#fff;border-radius:16px;padding:32px;width:100%;max-width:400px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .field input,.field textarea,.field select{width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--border);font-family:inherit;font-size:14px}
  .field textarea{min-height:110px;resize:vertical}
  .msg{font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:12px}
  .msg-error{background:#fdecec;color:#b3261e}
  .msg-ok{background:#e7f5eb;color:var(--primary-dark)}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:20px;border-bottom:1px solid var(--border)}
  .tabs button{padding:11px 16px;background:none;border:none;font-weight:600;font-size:13.5px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
  .tabs button.active{color:var(--primary-dark);border-color:var(--primary)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:10px;border-bottom:1px solid var(--border)}
  .footer{margin-top:60px;padding:28px 24px;text-align:center;color:var(--muted);font-size:13px;border-top:1px solid var(--border)}
  .badge-role{font-size:12px;background:#fff3;padding:2px 8px;border-radius:999px}
  .empty{color:var(--muted);font-size:14px;padding:30px 0;text-align:center}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .rt-hero{background:linear-gradient(120deg,#1b3b2b,#0f2419);color:#f3ead0}
  .rt-hero .pill-gold{background:rgba(184,144,46,.25);color:#e7cf8b}
  .img-thumb-sm{width:44px;height:44px;object-fit:cover;border-radius:8px;flex-shrink:0}
  .gallery-row{margin-bottom:10px}
  .order-card{margin-bottom:14px}
  .order-card .row{align-items:flex-start}
  .pill-teal{background:#e3f3f2;color:#0e6e66}
  .tab-badge{display:inline-block;min-width:18px;padding:1px 6px;border-radius:999px;background:#e14b4b;color:#fff;font-size:11px;font-weight:700;margin-left:4px;vertical-align:middle}
</style>
</head>
<body>

<div id="app"></div>

<script>
/* ======================= KONFIGURASI ======================= */
const CONFIG = {
  // 1) Deploy Code.gs sebagai Web App (lihat PANDUAN_SETUP.md)
  // 2) Tempel URL hasil deploy di bawah ini, ganti tulisan di antara tanda kutip
  API_URL: 'https://script.google.com/macros/s/AKfycbz37vPcbYpjoWMvPQIB5n0w5EkCU5vGRmlDWBT8XUQcLJge9SZkMv9xVDX6GtLeGr-fYg/exec'
};

/* ======================= STATE ======================= */
const State = {
  settings: {}, pages: {}, products: [],
  auth: JSON.parse(localStorage.getItem('sembako_auth') || 'null'),
  cart: JSON.parse(localStorage.getItem('sembako_cart') || '[]'),
  route: location.hash || '#/katalog',
  loading: true,
  notReady: false
};

function saveAuth(a){ State.auth = a; localStorage.setItem('sembako_auth', JSON.stringify(a)); }
function logout(){ saveAuth(null); location.hash = '#/katalog'; render(); }
function saveCart(){ localStorage.setItem('sembako_cart', JSON.stringify(State.cart)); }

/* ======================= API HELPER ======================= */
async function api(action, payload, method) {
  if (!CONFIG.API_URL || CONFIG.API_URL.indexOf('PASTE_URL') !== -1) {
    return { ok: false, error: 'NOT_CONFIGURED' };
  }
  try {
    if (method === 'GET') {
      const qs = new URLSearchParams({ action, ...(payload || {}) }).toString();
      const res = await fetch(CONFIG.API_URL + '?' + qs);
      return await res.json();
    } else {
      const res = await fetch(CONFIG.API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, ...(payload || {}) })
      });
      return await res.json();
    }
  } catch (err) {
    return { ok: false, error: 'Gagal menghubungi server: ' + err };
  }
}

/* ======================= UPLOAD GAMBAR ======================= */
function readFileAsDataURL(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
async function compressImageFile(file, maxDim, quality){
  maxDim = maxDim || 1100; quality = quality || 0.82;
  const dataUrl = await readFileAsDataURL(file);
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = dataUrl; });
  let { width, height } = img;
  if (width > maxDim || height > maxDim) {
    const ratio = Math.min(maxDim / width, maxDim / height);
    width = Math.round(width * ratio); height = Math.round(height * ratio);
  }
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  canvas.getContext('2d').drawImage(img, 0, 0, width, height);
  const outDataUrl = canvas.toDataURL('image/jpeg', quality);
  return outDataUrl.split(',')[1];
}
async function uploadImageFile(file, onDone){
  if (!file) return;
  if (!State.auth || State.auth.role !== 'admin') { alert('Sesi admin tidak valid, silakan login ulang.'); return; }
  try {
    const base64 = await compressImageFile(file);
    const res = await api('uploadImage', { token: State.auth.token, base64, mimeType: 'image/jpeg', filename: file.name }, 'POST');
    if (res.ok) onDone(res.data.url);
    else alert('Gagal mengunggah gambar: ' + res.error);
  } catch (err) {
    alert('Gagal memproses gambar: ' + err);
  }
}
function parseJsonSafe(v, fallback){
  if (Array.isArray(v)) return v;
  try { return v ? JSON.parse(v) : (fallback || []); } catch (e) { return fallback || []; }
}

/* ======================= LOAD DATA ======================= */
async function loadAll() {
  const [s, pg, pr] = await Promise.all([
    api('getSettings', {}, 'GET'),
    api('getPages', {}, 'GET'),
    api('getProducts', {}, 'GET')
  ]);
  if (s.ok === false && s.error === 'NOT_CONFIGURED') { State.notReady = true; State.loading = false; return; }
  if (s.ok) State.settings = s.data;
  if (pg.ok) { State.pages = {}; pg.data.forEach(p => State.pages[p.key] = p); }
  if (pr.ok) State.products = pr.data;
  State.loading = false;
}

/* ======================= ROUTER ======================= */
window.addEventListener('hashchange', () => { State.route = location.hash || '#/katalog'; render(); window.scrollTo(0,0); });

function go(hash){ location.hash = hash; }

/* ======================= RENDER ======================= */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function rupiah(n){ n = Number(n)||0; return 'Rp' + n.toLocaleString('id-ID'); }

/* ---------- LIGHTBOX FOTO (perbesar gambar saat diklik) ---------- */
function openImageLightbox(url){
  if (!url) return;
  const old = document.getElementById('img-lightbox');
  if (old) old.remove();
  const div = document.createElement('div');
  div.id = 'img-lightbox';
  div.className = 'modal-bg';
  div.onclick = closeImageLightbox;
  div.innerHTML = `
    <div style="max-width:90vw;max-height:90vh;position:relative" onclick="event.stopPropagation()">
      <button onclick="closeImageLightbox()" style="position:absolute;top:-14px;right:-14px;width:32px;height:32px;border-radius:50%;background:#fff;border:none;font-size:16px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3)">✕</button>
      <img src="${esc(url)}" style="max-width:90vw;max-height:90vh;border-radius:12px;display:block;box-shadow:0 8px 30px rgba(0,0,0,.4)"/>
    </div>`;
  document.body.appendChild(div);
}
function closeImageLightbox(){
  const el = document.getElementById('img-lightbox');
  if (el) el.remove();
}

function layout(content){
  const s = State.settings;
  const isAdmin = State.auth && State.auth.role === 'admin';
  const isClient = State.auth && State.auth.role === 'client';
  const route = State.route;
  const navItem = (hash, label) => `<a href="${hash}" class="${route.startsWith(hash) ? 'active':''}">${label}</a>`;

  return `
  <div class="topbar">
    <span>🟢 ${esc(s.openHours||'')}</span>
    <span>${esc(s.freeShippingNote||'')} &nbsp;|&nbsp; 📞 WA: ${esc(s.whatsapp||'')}</span>
  </div>
  <header class="main">
    <div class="brand-block">
      <div class="brand-logo">🏪</div>
      <div>
        <div class="brand-name brand">${esc(s.storeName||'Toko Sembako')}</div>
        <div class="brand-tag">${esc(s.tagline||'')}</div>
      </div>
    </div>
    <div class="search"><input placeholder="Cari beras, minyak, telur, gula, mi instan..." oninput="onSearch(this.value)"/></div>
    <div class="row">
      <a class="btn" href="#/keranjang">🛒 Keranjang (${State.cart.length})</a>
      ${isAdmin ? `<a class="btn btn-dark" href="#/admin">⚙️ Panel Admin</a><button class="btn" onclick="logout()">Keluar</button>`
        : isClient ? `<span class="btn btn-ghost">👤 ${esc(State.auth.name)}</span><button class="btn" onclick="logout()">Keluar</button>`
        : `<a class="btn btn-primary" href="#/login">Masuk / Daftar</a>`}
    </div>
  </header>
  <nav class="nav">
    ${navItem('#/katalog','🏬 ' + esc(s.navKatalog || 'Katalog Sembako'))}
    ${navItem('#/tentang-toko','ℹ️ ' + esc(s.navTentangToko || 'Tentang Toko Sembako'))}
    ${navItem('#/tentang-tahfidz','📖 ' + esc(s.navTentangTahfidz || 'Tentang Rumah Tahfidz'))}
    ${navItem('#/promo','🎁 ' + esc(s.navPromo || 'Paket Hemat & Promo'))}
  </nav>
  <div class="container">${content}</div>
  <div class="footer">© ${new Date().getFullYear()} ${esc(s.storeName||'Toko Sembako')} — data dikelola lewat Google Sheets.</div>
  `;
}

function render(){
  const app = document.getElementById('app');
  if (State.loading) { app.innerHTML = `<div class="container"><p>Memuat...</p></div>`; return; }
  if (State.notReady) { app.innerHTML = renderNotReady(); return; }

  const route = State.route;
  if (!route.startsWith('#/katalog') && heroSlideTimer) { clearInterval(heroSlideTimer); heroSlideTimer = null; }
  let content = '';
  if (route.startsWith('#/katalog')) content = renderKatalog();
  else if (route.startsWith('#/tentang-toko')) content = renderPage('tentang-toko-sembako');
  else if (route.startsWith('#/tentang-tahfidz')) content = renderPage('tentang-rumah-tahfidz', true);
  else if (route.startsWith('#/promo')) content = renderPromo();
  else if (route.startsWith('#/keranjang')) content = renderCart();
  else if (route.startsWith('#/login')) { app.innerHTML = renderAuthModal('login'); return; }
  else if (route.startsWith('#/daftar')) { app.innerHTML = renderAuthModal('daftar'); return; }
  else if (route.startsWith('#/admin')) { renderAdmin(app); return; }
  else content = renderKatalog();

  app.innerHTML = layout(content);
}

function renderNotReady(){
  return `<div class="container" style="max-width:640px;margin-top:60px">
    <div class="card">
      <h2>⚙️ Website belum tersambung ke database</h2>
      <p style="color:var(--muted)">Buka file <b>index.html</b>, cari baris <code>API_URL</code> di bagian atas &lt;script&gt;, lalu tempel URL Web App Apps Script Anda di sana (lihat <b>PANDUAN_SETUP.md</b>).</p>
    </div>
  </div>`;
}

/* ---------- KATALOG ---------- */
let searchTerm = '';
function onSearch(v){ searchTerm = v.toLowerCase(); renderKatalogInto(); }
function renderKatalogInto(){
  const el = document.getElementById('product-grid');
  if (el) el.innerHTML = productGridHtml();
}
function productGridHtml(){
  const items = State.products.filter(p => !searchTerm || (p.name||'').toLowerCase().includes(searchTerm));
  if (!items.length) return `<div class="empty">Produk tidak ditemukan.</div>`;
  return `<div class="grid grid-products">` + items.map(p => `
    <div class="card product-card">
      ${p.image ? `<img class="product-thumb" src="${esc(p.image)}" alt="${esc(p.name)}" style="cursor:zoom-in" onclick="event.stopPropagation();openImageLightbox('${esc(p.image).replace(/'/g,"\\'")}')"/>` : `<div class="product-thumb">🧺</div>`}
      <span class="pill">${esc(p.category||'')}</span>
      <h3 style="font-size:15px;margin:8px 0 2px">${esc(p.name)}</h3>
      <div style="font-size:12px;color:var(--muted)">${esc(p.unit||'')}</div>
      <div class="price">${rupiah(p.price)}</div>
      <button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="addToCart('${esc(p.id)}')">+ Keranjang</button>
    </div>`).join('') + `</div>`;
}
/* ---------- HERO SLIDER (banner beranda, bisa lebih dari 1 foto + animasi geser) ---------- */
let heroSlideIndex = 0;
let heroSlideTimer = null;

function heroSliderHtml(){
  const banners = parseJsonSafe(State.settings.heroBanners, []);
  // Slide default (selalu ada) sebagai fallback kalau admin belum tambah banner foto
  const defaultSlide = { image: '', title: 'Belanja Sembako Lengkap Hari Ini', subtitle: 'Semua orang bisa lihat-lihat katalog. Untuk checkout, silakan daftar/masuk dulu ya.' };
  const slides = banners.length ? banners : [defaultSlide];

  const slideHtml = (b, i) => {
    const bg = b.image ? `background-image:url('${esc(b.image)}')` : '';
    return `<div class="hero-slide" style="${bg}">
      <div class="hero-slide-overlay">
        <span class="pill" style="background:#ffffff33;color:#fff">Katalog</span>
        <h1>${esc(b.title || 'Belanja Sembako Lengkap Hari Ini')}</h1>
        <p>${esc(b.subtitle || '')}</p>
      </div>
    </div>`;
  };

  return `
    <div class="hero-slider" id="hero-slider">
      <div class="hero-slider-track" id="hero-slider-track" style="transform:translateX(-${heroSlideIndex * 100}%)">
        ${slides.map(slideHtml).join('')}
      </div>
      ${slides.length > 1 ? `
        <button class="hero-arrow prev" onclick="heroSlideGo(${(heroSlideIndex - 1 + slides.length) % slides.length})">‹</button>
        <button class="hero-arrow next" onclick="heroSlideGo(${(heroSlideIndex + 1) % slides.length})">›</button>
        <div class="hero-dots">
          ${slides.map((_, i) => `<button class="hero-dot ${i===heroSlideIndex?'active':''}" onclick="heroSlideGo(${i})"></button>`).join('')}
        </div>` : ''}
    </div>`;
}
function heroSlideGo(i){
  const banners = parseJsonSafe(State.settings.heroBanners, []);
  const total = Math.max(banners.length, 1);
  heroSlideIndex = ((i % total) + total) % total;
  const track = document.getElementById('hero-slider-track');
  if (track) {
    track.style.transform = `translateX(-${heroSlideIndex * 100}%)`;
    document.querySelectorAll('.hero-dot').forEach((d, idx) => d.classList.toggle('active', idx === heroSlideIndex));
  }
  restartHeroAutoSlide();
}
function restartHeroAutoSlide(){
  if (heroSlideTimer) clearInterval(heroSlideTimer);
  const banners = parseJsonSafe(State.settings.heroBanners, []);
  if (banners.length > 1) {
    heroSlideTimer = setInterval(() => heroSlideGo(heroSlideIndex + 1), 5000);
  }
}

function renderKatalog(){
  heroSlideIndex = 0;
  setTimeout(restartHeroAutoSlide, 0);
  return `
    ${heroSliderHtml()}
    <h2 class="section-title">Katalog Sembako</h2>
    <p class="section-sub">${State.products.length} produk tersedia</p>
    <div id="product-grid">${productGridHtml()}</div>
  `;
}

function addToCart(id){
  const p = State.products.find(x => String(x.id) === String(id));
  if (!p) return;
  const existing = State.cart.find(c => c.id === id);
  if (existing) existing.qty += 1; else State.cart.push({ id, name: p.name, price: p.price, qty: 1 });
  saveCart(); render();
}

/* ---------- TENTANG (dipakai untuk Toko Sembako & Rumah Tahfidz) ---------- */
function renderPage(key, isTahfidz){
  const p = State.pages[key] || {};
  const gallery = parseJsonSafe(p.gallery, []);
  const promoGallery = parseJsonSafe(p.promoGallery, []);
  const santri = parseJsonSafe(p.santri, []);
  const heroStyle = p.image ? `style="background-image:linear-gradient(rgba(15,20,17,.45),rgba(15,20,17,.45)),url('${esc(p.image)}');background-size:cover;background-position:center"` : '';
  return `
    <div class="hero ${isTahfidz ? 'rt-hero' : ''}" ${heroStyle}>
      <span class="pill ${isTahfidz?'pill-gold':''}" style="background:#ffffff33;color:#fff">${isTahfidz ? '📖 Rumah Tahfidz' : 'ℹ️ Tentang Kami'}</span>
      <h1>${esc(p.title || (isTahfidz ? 'Tentang Rumah Tahfidz' : 'Tentang Toko Sembako'))}</h1>
    </div>
    <div class="card" style="max-width:760px;line-height:1.7;font-size:15px;margin-bottom:26px">
      ${p.content ? esc(p.content).replace(/\\n/g,'<br/>') : '<span class="empty">Konten belum diisi admin.</span>'}

async function submitAuth(mode){
  const email = document.getElementById('af-email').value.trim();
  const pass = document.getElementById('af-pass').value;
  const msgEl = document.getElementById('auth-msg');
  msgEl.innerHTML = '';
  let res;
  if (mode === 'admin') res = await api('adminLogin', { email, password: pass }, 'POST');
  else if (mode === 'login') res = await api('clientLogin', { email, password: pass }, 'POST');
  else {
    const name = document.getElementById('af-name').value.trim();
    const phone = document.getElementById('af-phone').value.trim();
    res = await api('clientRegister', { name, email, phone, password: pass }, 'POST');
  }

/* ---------- GRAFIK STOK BARANG ---------- */
function stockChartHtml(products){
  if (!products || !products.length) return '';
  const items = products.slice(0, 20); // batasi 20 biar grafik tidak kepanjangan
  const max = Math.max.apply(null, items.map(p => Number(p.stock)||0).concat([1]));
  const barW = 34, gap = 16, chartH = 150, labelH = 60, topPad = 20;
  const width = items.length * (barW + gap) + gap;
  const shortName = (s) => { s = String(s||''); return s.length > 12 ? s.slice(0,11) + '…' : s; };
  const bars = items.map((p, i) => {
    const stock = Number(p.stock) || 0;
    const h = Math.max(2, Math.round((stock / max) * chartH));
    const x = gap + i * (barW + gap);
    const y = topPad + (chartH - h);
    const color = stock <= 5 ? '#c0392b' : stock <= 15 ? '#b8902e' : '#0f8a4b';
    const labelY = topPad + chartH + 16;
    return `<g>
      <rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="4" fill="${color}"></rect>
      <text x="${x + barW/2}" y="${y - 6}" font-size="11" text-anchor="middle" fill="#16241d" font-weight="600">${stock}</text>
      <text x="${x + barW/2}" y="${labelY}" font-size="10" text-anchor="end" fill="#66756c" transform="rotate(-40 ${x + barW/2} ${labelY})">${esc(shortName(p.name))}</text>
    </g>`;
  }).join('');
  return `
    <div class="card" style="margin-bottom:18px;overflow-x:auto">
      <h3 style="margin-top:0">📊 Grafik Stok Barang</h3>
      <svg width="${width}" height="${topPad + chartH + labelH}" viewBox="0 0 ${width} ${topPad + chartH + labelH}" style="display:block">
        <line x1="0" y1="${topPad + chartH}" x2="${width}" y2="${topPad + chartH}" stroke="#e4e2da"></line>
        ${bars}
      </svg>
      <div style="font-size:12px;color:var(--muted);margin-top:6px">
        🟩 Stok aman (&gt;15) &nbsp; 🟨 Stok menipis (6–15) &nbsp; 🟥 Stok rendah (≤5)
        ${products.length > 20 ? `<br/>Menampilkan 20 produk pertama dari ${products.length} total produk.` : ''}
      </div>
    </div>`;
}

  const p = State.products.find(x => String(x.id)===String(id)); if (!p) return;
  document.getElementById('p-id').value = p.id;

  document.getElementById('p-category').value = p.category;
  document.getElementById('p-price').value = p.price;
  document.getElementById('p-unit').value = p.unit;
  document.getElementById('p-stock').value = p.stock;
  document.getElementById('p-image').value = p.image || '';
  const prev = document.getElementById('p-image-preview');
  if (p.image) { prev.src = p.image; prev.style.display = 'inline-block'; } else { prev.style.display = 'none'; }

    image: document.getElementById('p-image').value || ''

function addHeroBannerRow(){
  document.getElementById('hero-banner-list').insertAdjacentHTML('beforeend', heroBannerRowHtml({}));
}
function collectHeroBanners(){
  const container = document.getElementById('hero-banner-list');
  if (!container) return [];
  const out = [];
  container.querySelectorAll('.hero-banner-row').forEach(row => {
    const img = row.querySelector('img');
    const inputs = row.querySelectorAll('input:not([type="file"])');
    const textarea = row.querySelector('textarea');
    const url = img ? img.dataset.url : '';
    const title = inputs[0] ? inputs[0].value.trim() : '';
    const subtitle = textarea ? textarea.value.trim() : '';
    if (url || title || subtitle) out.push({ image: url || '', title, subtitle });
  });
  return out;
}

function santriRowHtml(s){
  s = s || {};
  const uid = 'row' + (++rowUidCounter);
  return `

          <input type="file" accept="image/*" style="font-size:11px;margin-top:4px;width:78px" onchange="onGalleryImagePicked(this,'${uid}')"/>
        </div>
        <div class="field" style="flex:2;min-width:140px;margin-bottom:0"><label>Nama</label><input id="nm-${uid}" value="${esc(s.name||'')}"/></div>
        <div class="field" style="flex:1;min-width:110px;margin-bottom:0"><label>Kelas / Usia</label><input id="kl-${uid}" value="${esc(s.kelas||'')}"/></div>
        <div class="field" style="flex:2;min-width:160px;margin-bottom:0"><label>Catatan / Hafalan</label><input id="ct-${uid}" value="${esc(s.catatan||'')}"/></div>
        <button class="btn" style="align-self:flex-end" onclick="removeRow('${uid}')">Hapus</button>
      </div>
    </div>`;
}
function addSantriRow(){
  document.getElementById('pg-list-santri').insertAdjacentHTML('beforeend', santriRowHtml({}));
}

function collectGalleryRows(field){
  const container = document.getElementById('pg-list-' + field);
  if (!container) return [];
  const out = [];
  container.querySelectorAll('.gallery-row').forEach(row => {
    const img = row.querySelector('img');
    const cap = row.querySelector('textarea');
    const url = img ? img.dataset.url : '';
    const caption = cap ? cap.value.trim() : '';
    if (url || caption) out.push({ image: url || '', caption });
  });
  return out;
}
function collectSantriRows(){
  const container = document.getElementById('pg-list-santri');
  if (!container) return [];
  const out = [];
  container.querySelectorAll('.santri-row').forEach(row => {
    const img = row.querySelector('img');
    const textInputs = Array.from(row.querySelectorAll('input')).filter(i => i.type !== 'file');
    const name = textInputs[0] ? textInputs[0].value.trim() : '';
    const kelas = textInputs[1] ? textInputs[1].value.trim() : '';
    const catatan = textInputs[2] ? textInputs[2].value.trim() : '';
    const image = img ? (img.dataset.url || '') : '';
    if (name || kelas || catatan || image) out.push({ name, kelas, catatan, image });
  });
  return out;
}

async function savePageForm(key){
  const page = {
    key,
    title: document.getElementById('pg-title').value,
    content: document.getElementById('pg-content').value,
    image: document.getElementById('pg-image').value || '',
    gallery: collectGalleryRows('gallery')
  };
  if (key === 'tentang-toko-sembako') page.promoGallery = collectGalleryRows('promoGallery');
  if (key === 'tentang-rumah-tahfidz') page.santri = collectSantriRows();
  const res = await api('savePage', { token: State.auth.token, page }, 'POST');
  const msg = document.getElementById('pg-msg');
  if (res.ok) { msg.textContent = '✅ Tersimpan'; await loadAll(); }
  else msg.textContent = '❌ ' + res.error;
}

/* ---------- PESANAN MASUK (gaya WhatsApp: tab status + kartu + aksi cepat) ---------- */
let orderFilter = 'Semua';
let orderSearch = '';
let ordersCache = [];

async function adminPesananHtml(){
  const el = document.getElementById('admin-content');
  el.innerHTML = '<p>Memuat pesanan...</p>';
  const res = await api('getOrders', { token: State.auth.token }, 'POST');
  if (!res.ok) { el.innerHTML = `<div class="msg msg-error">${esc(res.error)}</div>`; return; }
  ordersCache = res.data;
  el.innerHTML = ordersPanelHtml();
  updateOrdersTabBadge();
}
/* Badge notifikasi di tab "Pesanan Masuk" supaya admin langsung tahu ada
   pesanan Baru / Diproses / Siap diambil tanpa harus buka tabnya dulu. */
async function loadOrdersTabBadge(){
  const res = await api('getOrders', { token: State.auth.token }, 'POST');
  if (res.ok) { ordersCache = res.data; updateOrdersTabBadge(); }
}
function updateOrdersTabBadge(){
  const btn = document.getElementById('tab-pesanan');
  if (!btn) return;
  const activeCount = ordersCache.filter(o => o.status === 'Baru' || o.status === 'Diproses' || o.status === 'Siap diambil').length;
  btn.innerHTML = `🧾 Pesanan Masuk${activeCount ? `<span class="tab-badge">${activeCount}</span>` : ''}`;
}
function ordersPanelHtml(){
  const statuses = ['Semua','Baru','Diproses','Siap diambil','Selesai'];
  const countFor = (s) => s === 'Semua' ? ordersCache.length : ordersCache.filter(o => o.status === s).length;
  const filtered = ordersCache.filter(o => {
    const matchStatus = orderFilter === 'Semua' || o.status === orderFilter;
    const hay = ((o.clientName||'') + ' ' + (o.items||'') + ' ' + (o.clientPhone||'') + ' ' + (o.clientEmail||'')).toLowerCase();
    const matchSearch = !orderSearch || hay.includes(orderSearch.toLowerCase());
    return matchStatus && matchSearch;
  }).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

  return `
    <div class="field" style="max-width:420px"><input placeholder="🔎 Cari pelanggan atau item..." value="${esc(orderSearch)}" oninput="onOrderSearch(this.value)"/></div>
    <div class="tabs">${statuses.map(s => `<button class="${orderFilter===s?'active':''}" onclick="setOrderFilter('${s}')">${s} ${countFor(s) ? `<span class="tab-badge" style="background:${orderFilter===s?'var(--primary)':'#c9c4b6'}">${countFor(s)}</span>` : ''}</button>`).join('')}</div>
    ${!filtered.length ? '<div class="empty">Tidak ada pesanan pada status ini.</div>' : filtered.map(orderCardHtml).join('')}
  `;
}
function onOrderSearch(v){ orderSearch = v; renderOrdersList(); }
function setOrderFilter(s){ orderFilter = s; renderOrdersList(); }
function renderOrdersList(){
  const el = document.getElementById('admin-content');
  if (el) el.innerHTML = ordersPanelHtml();
}
function statusPillClass(status){
  if (status === 'Baru') return 'pill-gold';
  if (status === 'Diproses') return 'pill-blue';
  if (status === 'Siap diambil') return 'pill-teal';
  if (status === 'Dibatalkan') return 'pill-red';
  return 'pill';
}
function orderCardHtml(o){
  let items = [];
  try { items = JSON.parse(o.items || '[]'); } catch(e){ items = []; }
  const itemsSummary = items.map(it => `${it.name}${it.qty>1?(' x'+it.qty):''}`).join(', ');
  const digits = (o.clientPhone||'').replace(/[^0-9]/g,'');
  const waNumber = digits ? (digits.charAt(0) === '0' ? '62' + digits.slice(1) : digits) : '';
  const waLink = waNumber ? `https://wa.me/${waNumber}` : '';

  let actions = '';
  if (o.status === 'Baru') actions = `<button class="btn btn-dark" onclick="setOrderStatus('${esc(o.id)}','Diproses')">✔ Mulai proses</button>`;
  else if (o.status === 'Diproses') actions = `<button class="btn btn-dark" onclick="setOrderStatus('${esc(o.id)}','Siap diambil')">✔ Tandai siap</button>`;
  else if (o.status === 'Siap diambil') actions = `<button class="btn btn-dark" onclick="setOrderStatus('${esc(o.id)}','Selesai')">✔ Tandai selesai</button>`;

  const waBtn = waLink ? `<a class="btn" href="${waLink}" target="_blank" rel="noopener">💬 Hubungi WhatsApp</a>` : `<span class="btn btn-ghost" style="opacity:.5">Tanpa No. WA</span>`;
  const cancelBtn = (o.status !== 'Selesai' && o.status !== 'Dibatalkan') ? `<button class="btn" style="color:#b3261e" onclick="setOrderStatus('${esc(o.id)}','Dibatalkan')">✕ Batalkan</button>` : '';

  return `
    <div class="card order-card">
      <div class="row" style="justify-content:space-between">
        <div>
          <b>${esc(o.clientName || o.clientEmail)}</b>
          <span style="color:var(--muted);font-size:12px">#${esc(String(o.id).slice(-6))}</span><br/>
          <span style="font-size:12px;color:var(--muted)">${esc(o.clientPhone||'-')} · ${esc(new Date(o.createdAt).toLocaleString('id-ID'))}</span>
        </div>
        <span class="pill ${statusPillClass(o.status)}">${esc(o.status)}</span>
      </div>
      <div style="margin:10px 0;font-size:14px">${esc(itemsSummary || '-')}<br/><b>${rupiah(o.total)}</b></div>
      <div class="row">${actions} ${waBtn} ${cancelBtn}</div>
    </div>`;
}
async function setOrderStatus(id, status){
  const res = await api('updateOrderStatus', { token: State.auth.token, id, status }, 'POST');
  if (res.ok) {
    const o = ordersCache.find(x => String(x.id) === String(id));
    if (o) o.status = status;
    renderOrdersList();
    updateOrdersTabBadge();
  } else alert('Gagal mengubah status: ' + res.error);
}
